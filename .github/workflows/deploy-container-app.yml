name: Build and deploy Opti Route

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to build and deploy (for example v1.0.0)"
        required: true
        type: string
      source_ref:
        description: "Git tag or commit to build; use v1.0.0 for the first release"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: opti-route-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: FR-RG-OPTIROUTE
  ACR_NAME: croptiroute
  ACR_LOGIN_SERVER: croptiroute.azurecr.io
  IMAGE_REPOSITORY: opti-route
  CONTAINER_APP_NAME: app-optiroute

jobs:
  build-and-deploy:
    name: Build image and deploy revision
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve immutable image tags
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION_TAG="${{ inputs.image_tag }}"
          else
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "image_tag must use a version tag such as v1.0.0" >&2
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Azure Container Registry
        shell: bash
        run: az acr login --name "$ACR_NAME"

      - name: Build and publish image
        shell: bash
        run: |
          IMAGE_BASE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}"
          docker build --pull \
            --tag "${IMAGE_BASE}:${{ steps.image.outputs.version }}" \
            --tag "${IMAGE_BASE}:${{ steps.image.outputs.sha }}" \
            .
          docker push "${IMAGE_BASE}:${{ steps.image.outputs.version }}"
          docker push "${IMAGE_BASE}:${{ steps.image.outputs.sha }}"

      - name: Install Container Apps CLI extension
        shell: bash
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy the versioned image when the Container App exists
        shell: bash
        run: |
          if ! az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none 2>/dev/null; then
            echo "::notice::Image published. Deployment will start once ${CONTAINER_APP_NAME} exists."
            exit 0
          fi

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${{ steps.image.outputs.version }}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Check Streamlit health endpoint
        shell: bash
        run: |
          if ! az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none 2>/dev/null; then
            exit 0
          fi

          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [[ -z "$FQDN" ]]; then
            echo "::warning::No external FQDN is configured; skipping health check."
            exit 0
          fi

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://${FQDN}/_stcore/health"; then
              exit 0
            fi
            sleep 10
          done

          echo "The deployed revision did not answer the Streamlit health endpoint." >&2
          exit 1
