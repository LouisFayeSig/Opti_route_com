[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opti-route-com"
version = "0.1.0"
description = "Optimisation de tournées commerciales avec Streamlit, Azure Maps et OR-Tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Authlib>=1.7.2,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "ortools>=9.12,<10",
  "pandas>=2.2,<3",
  "Pillow>=12.3,<13",
  "pyxlsb>=1.0,<2",
  "pydeck>=0.9,<1",
  "python-dotenv>=1.2.3,<2",
  "reportlab>=4.2,<5",
  "requests>=2.33,<3",
  "streamlit>=1.48,<2",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Aux frontières Streamlit, une erreur inattendue doit devenir un message utilisateur.
ignore = ["BLE001"]
